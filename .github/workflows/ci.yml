name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: photocards_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-not-secret
      DEBUG: "False"
      DB_NAME: photocards_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY (Phase 1): skip cleanly until backend/ exists.
      # Remove this guard once the scaffold is merged.
      - name: Detect backend
        id: detect
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/requirements.txt not found - skipping backend checks"
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Check migrations
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: python manage.py test

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY (Phase 1): skip cleanly until frontend/ exists.
      # Remove this guard once the scaffold is merged.
      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package-lock.json not found - skipping frontend checks"
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint --if-present
      - name: Test
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm test --if-present -- --watchAll=false
      - name: Build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run build

  # Deploy jobs are added in Phase 4/5 (main only, needs both test jobs).
